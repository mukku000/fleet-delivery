<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VelocityTrack - Fleet Delivery Tracker & AI Dispatcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<style>
  :root {
    --bg-main: #f8fafc;
    --surface: #ffffff;
    --surface-hover: #f1f5f9;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --accent: #4f46e5;
    --accent-dark: #4338ca;
    --accent-light: #e0e7ff;
    --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  }

  body.dark-theme {
    --bg-main: #0b0f19;
    --surface: #1e293b;
    --surface-hover: #334155;
    --border: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent: #6366f1;
    --accent-dark: #4f46e5;
    --accent-light: #1e1b4b;
    --accent-gradient: linear-gradient(135deg, #6366f1 0%, #22d3ee 100%);
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-main);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }

  header {
    background: var(--accent-gradient);
    color: #ffffff;
    padding: 1rem 1.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-md);
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .brand-icon {
    font-size: 1.8rem;
    background: rgba(255, 255, 255, 0.2);
    padding: 0.4rem;
    border-radius: 12px;
    backdrop-filter: blur(4px);
  }

  .brand-text h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .brand-text p {
    font-size: 0.8rem;
    opacity: 0.9;
    font-weight: 400;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(255, 255, 255, 0.2);
    padding: 0.3rem 0.75rem;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 500;
    backdrop-filter: blur(4px);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 8px #22c55e;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }

  .theme-toggle-btn {
    background: rgba(255, 255, 255, 0.18);
    border: none;
    color: #ffffff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .theme-toggle-btn:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.05);
  }

  .chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 960px;
    width: 100%;
    margin: 0 auto;
    height: calc(100vh - 65px);
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    scroll-behavior: smooth;
  }

  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 88%;
    animation: fadeIn 0.25s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; }
  .msg.agent { align-self: flex-start; }

  .sender-header {
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 0.3rem;
    color: var(--text-secondary);
    padding-left: 0.2rem;
  }

  .msg.user .sender-header { text-align: right; padding-right: 0.2rem; }

  .bubble {
    padding: 0.95rem 1.25rem;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.5;
    box-shadow: var(--shadow-sm);
    word-break: break-word;
    position: relative;
  }

  .msg.user .bubble {
    background: var(--accent);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }

  .msg.agent .bubble {
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg.agent .bubble.rich {
    padding: 1rem;
    width: 100%;
    background: var(--surface);
  }

  .msg-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--text-secondary);
    margin-top: 0.35rem;
    padding: 0 0.3rem;
    gap: 0.5rem;
  }

  .copy-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 0.7rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.2rem;
    padding: 0.1rem 0.3rem;
    border-radius: 4px;
    transition: background 0.2s;
  }

  .copy-btn:hover { background: var(--surface-hover); color: var(--accent); }

  /* Typing Indicator */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.85rem 1.1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }

  .typing-dot {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: typingBounce 1.4s infinite ease-in-out both;
  }

  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }

  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Prompt Pills */
  .prompts-container {
    padding: 0.75rem 1.5rem 0.25rem 1.5rem;
  }

  .filter-tabs {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.5rem;
    scroll-behavior: smooth;
  }

  .filter-tabs::-webkit-scrollbar { height: 4px; }
  .filter-tabs::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

  .prompt-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 0.45rem 0.85rem;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .prompt-btn:hover {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent-dark);
    transform: translateY(-1px);
  }

  /* Form & Input */
  form {
    display: flex;
    gap: 0.75rem;
    padding: 1rem 1.5rem 1.5rem 1.5rem;
    background: var(--bg-main);
  }

  input {
    flex: 1;
    padding: 0.85rem 1.2rem;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
    background: var(--surface-hover);
    color: var(--text-primary);
  }

  input:focus {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 3px var(--accent-light);
  }

  button.send-btn {
    padding: 0.85rem 1.4rem;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #ffffff;
    font-weight: 600;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: var(--shadow-md);
  }

  button.send-btn:hover {
    opacity: 0.95;
    transform: translateY(-1px);
    box-shadow: var(--shadow-lg);
  }

  /* A2UI Component Styles */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    background: var(--surface);
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-size: 1.35rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h2 { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: var(--accent); }
  .a2text.a2-caption { font-size: 0.75rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; }
  .a2img {
    max-width: 100%;
    border-radius: 12px;
    margin-top: 0.5rem;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .a2img:hover { transform: scale(1.02); box-shadow: var(--shadow-lg); }

  /* Interactive Card Actions */
  .card-actions {
    display: flex;
    gap: 0.4rem;
    margin-top: 0.85rem;
    flex-wrap: wrap;
  }

  .action-pill {
    background: var(--surface-hover);
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 0.3rem 0.65rem;
    border-radius: 14px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.25rem;
  }

  .action-pill:hover {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  /* Lightbox Modal */
  .lightbox-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .lightbox-modal.active { display: flex; }
  .lightbox-img { max-width: 90vw; max-height: 85vh; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  .lightbox-close { position: absolute; top: 20px; right: 25px; color: #fff; font-size: 2rem; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="material-symbols-outlined brand-icon">local_shipping</span>
    <div class="brand-text">
      <h1>NovaSmart Fleet Ops</h1>
      <p>Autonomous Dark-Store Dispatcher & AI Agent Portal</p>
    </div>
  </div>
  <div class="header-actions">
    <div class="status-badge">
      <div class="status-dot"></div>
      <span>Agent Active</span>
    </div>
    <button class="theme-toggle-btn" id="themeToggle" title="Toggle Dark/Light Mode">
      <span class="material-symbols-outlined" id="themeIcon" style="color: #fff;">dark_mode</span>
    </button>
  </div>
</header>

<!-- Enterprise Operations Dashboard Bar -->
<div style="max-width: 1000px; margin: 0.75rem auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem; padding: 0 1.5rem;">
  <div style="background: var(--surface); border: 1px solid var(--border); padding: 0.85rem 1rem; border-radius: 14px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 0.75rem;">
    <div style="background: var(--accent-light); color: var(--accent); padding: 0.6rem; border-radius: 10px; display: flex;"><span class="material-symbols-outlined">inventory_2</span></div>
    <div>
      <div style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 500;">Active Orders</div>
      <div style="font-size: 1.1rem; font-weight: 700; color: var(--text-primary);">100+ Express</div>
    </div>
  </div>

  <div style="background: var(--surface); border: 1px solid var(--border); padding: 0.85rem 1rem; border-radius: 14px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 0.75rem;">
    <div style="background: var(--accent-light); color: var(--accent); padding: 0.6rem; border-radius: 10px; display: flex;"><span class="material-symbols-outlined">two_wheeler</span></div>
    <div>
      <div style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 500;">Rider Telemetry</div>
      <div style="font-size: 1.1rem; font-weight: 700; color: var(--text-primary);">12 Active Couriers</div>
    </div>
  </div>

  <div style="background: var(--surface); border: 1px solid var(--border); padding: 0.85rem 1rem; border-radius: 14px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 0.75rem;">
    <div style="background: var(--accent-light); color: var(--accent); padding: 0.6rem; border-radius: 10px; display: flex;"><span class="material-symbols-outlined">store</span></div>
    <div>
      <div style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 500;">Dark-Store Hub</div>
      <div style="font-size: 1.1rem; font-weight: 700; color: var(--text-primary);">Downtown #1</div>
    </div>
  </div>

  <div style="background: var(--surface); border: 1px solid var(--border); padding: 0.85rem 1rem; border-radius: 14px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 0.75rem;">
    <div style="background: var(--accent-light); color: var(--accent); padding: 0.6rem; border-radius: 10px; display: flex;"><span class="material-symbols-outlined">cloud</span></div>
    <div>
      <div style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 500;">Weather Radar</div>
      <div style="font-size: 1.1rem; font-weight: 700; color: var(--text-primary);">NWS Monitored</div>
    </div>
  </div>
</div>

<div class="chat-container">
  <div id="log"></div>

  <div class="prompts-container">
    <div class="filter-tabs">
      <button type="button" class="prompt-btn" onclick="sendPrompt('📦 Check status of express order ORD-101')">📦 Order ORD-101</button>
      <button type="button" class="prompt-btn" onclick="sendPrompt('⚡ Check courier telemetry for courier CR-502')">⚡ Courier Telemetry</button>
      <button type="button" class="prompt-btn" onclick="sendPrompt('🌧️ Check delivery route weather conditions for ORD-101')">🌧️ Route Weather</button>
      <button type="button" class="prompt-btn" onclick="sendPrompt('🗺️ Show delivery route map for express order ORD-101')">🗺️ Route Map</button>
      <button type="button" class="prompt-btn" onclick="sendPrompt('🚀 Optimize batch dispatch assignments for pending orders at Downtown Express Hub #1')">🚀 Batch Dispatch</button>
      <button type="button" class="prompt-btn" onclick="sendPrompt('📸 Generate a package contents preview image for ORD-101')">📸 Generate POD Image</button>
      <button type="button" class="prompt-btn" onclick="sendPrompt('🎥 Generate a short promo video for Matcha Latte express item')">🎥 Generate Item Video</button>
    </div>
  </div>

  <form id="form">
    <input id="input" placeholder="Ask about orders, couriers, route maps, weather, or batch dispatch..." autocomplete="off" autofocus>
    <button class="send-btn">
      <span>Send</span>
      <span class="material-symbols-outlined" style="font-size: 1.1rem; color: white;">send</span>
    </button>
  </form>
</div>

<!-- Image Lightbox Modal -->
<div class="lightbox-modal" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img class="lightbox-img" id="lightboxImg" src="" alt="Preview">
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const themeToggle = document.getElementById("themeToggle");
const themeIcon = document.getElementById("themeIcon");

// Dark Mode Toggle
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark-theme");
  themeIcon.textContent = "light_mode";
}

themeToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark-theme");
  const isDark = document.body.classList.contains("dark-theme");
  themeIcon.textContent = isDark ? "light_mode" : "dark_mode";
  localStorage.setItem("theme", isDark ? "dark" : "light");
});

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true }));
}

function getTimeStr() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text);
  const orig = btn.innerHTML;
  btn.innerHTML = "✅ Copied";
  setTimeout(() => { btn.innerHTML = orig; }, 1800);
}

function el(tag, className, text) {
  const elem = document.createElement(tag);
  if (className) elem.className = className;
  if (text) elem.textContent = text;
  return elem;
}

function bubble(role) {
  const m = el("div", "msg " + role);
  const label = el("div", "sender-header", role === "user" ? "You" : "VelocityBot");
  const b = el("div", "bubble");
  m.appendChild(label);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return { msgNode: m, bubbleNode: b };
}

function showTypingIndicator() {
  const m = el("div", "msg agent");
  const label = el("div", "sender-header", "VelocityBot");
  const indicator = el("div", "typing-indicator");
  indicator.appendChild(el("div", "typing-dot"));
  indicator.appendChild(el("div", "typing-dot"));
  indicator.appendChild(el("div", "typing-dot"));
  m.appendChild(label);
  m.appendChild(indicator);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return m;
}

// Lightbox modal logic
function openLightbox(src) {
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightbox").classList.add("active");
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("active");
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); 
      img.src = src; 
      img.alt = boundStr(props.alt) || ""; 
      img.onclick = () => openLightbox(src);
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function attachCardActionButtons(container, textStr) {
  // Extract order ID if present (e.g., ORD-101)
  const orderMatch = textStr.match(/ORD-\d+/i);
  if (!orderMatch) return;
  const orderId = orderMatch[0].toUpperCase();

  const actionsDiv = el("div", "card-actions");

  const deliverBtn = el("button", "action-pill", "📦 Mark Delivered");
  deliverBtn.onclick = () => sendPrompt(`Update order ${orderId} status to Delivered`);

  const weatherBtn = el("button", "action-pill", "🌧️ Route Weather");
  weatherBtn.onclick = () => sendPrompt(`Check delivery route weather conditions for ${orderId}`);

  const mapBtn = el("button", "action-pill", "🗺️ Route Map");
  mapBtn.onclick = () => sendPrompt(`Show delivery route map for express order ${orderId}`);

  actionsDiv.appendChild(deliverBtn);
  actionsDiv.appendChild(weatherBtn);
  actionsDiv.appendChild(mapBtn);

  container.appendChild(actionsDiv);
}

function renderReply(bubbleObj, parts) {
  const b = bubbleObj.bubbleNode;
  const m = bubbleObj.msgNode;
  b.textContent = "";

  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    const videoMatch = textStr.match(/https:\/\/storage\.googleapis\.com\/[^\s"'\)]+\.mp4/i);
    const staticMapMatch = textStr.match(/https:\/\/maps\.googleapis\.com\/maps\/api\/staticmap[^\s"'\)]+/i);

    if (videoMatch) {
      const vidUrl = videoMatch[0];
      const vidNode = el("video", "a2video");
      vidNode.src = vidUrl;
      vidNode.controls = true;
      vidNode.style.maxWidth = "100%";
      vidNode.style.borderRadius = "12px";
      vidNode.style.marginTop = "8px";
      vidNode.style.boxShadow = "0 4px 12px rgba(0,0,0,0.15)";
      const cleanText = textStr.replace(vidUrl, "").trim();
      if (cleanText) b.appendChild(el("div", null, cleanText));
      b.appendChild(vidNode);
    } else if (staticMapMatch) {
      const mapUrl = staticMapMatch[0];
      const imgNode = el("img", "a2img");
      imgNode.src = mapUrl;
      imgNode.onclick = () => openLightbox(mapUrl);
      b.appendChild(el("div", null, textStr.replace(mapUrl, "").trim()));
      b.appendChild(imgNode);
    } else {
      b.appendChild(el("div", null, textStr));
    }
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
    const allText = textStr + "\n" + flattenText(a2ui);
    attachCardActionButtons(b, allText);
  } else if (textStr && /ORD-\d+/i.test(textStr)) {
    attachCardActionButtons(b, textStr);
  }

  if (!b.childNodes.length) b.textContent = "(no response)";

  // Add Footer with Timestamp and Copy button
  const footer = el("div", "msg-footer");
  footer.appendChild(el("span", null, getTimeStr()));
  if (textStr) {
    const cpBtn = el("button", "copy-btn", "📋 Copy");
    cpBtn.onclick = () => copyText(cpBtn, textStr);
    footer.appendChild(cpBtn);
  }
  m.appendChild(footer);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  
  const userObj = bubble("user");
  userObj.bubbleNode.textContent = text;
  const userFooter = el("div", "msg-footer", getTimeStr());
  userObj.msgNode.appendChild(userFooter);
  
  input.value = "";
  const typingNode = showTypingIndicator();

  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    typingNode.remove();
    const agentObj = bubble("agent");

    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(agentObj, data.parts || []);
  } catch (e) {
    typingNode.remove();
    const agentObj = bubble("agent");
    agentObj.bubbleNode.textContent = "Error: " + e.message;
  }
});
</script>
